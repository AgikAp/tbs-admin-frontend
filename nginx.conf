# custom nginx configuration for the admin frontend
# enables SPA routing by falling back to index.html when a path
# doesn't match a real file.

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # serve static files, but if the file doesn't exist forward to
    # index.html so the client-side router can handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # optional: log format, gzip, etc. could be added here
}
